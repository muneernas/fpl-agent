[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-agent"
version = "0.1.0"
description = "Fantasy Premier League advisor agent with live FPL API data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31.0"]

[project.scripts]
fpl-agent = "fpl_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
